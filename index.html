<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conflict Tracker</title>
  <!-- Load Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* iOS System Font & Smoothness */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    
    /* Smooth transition for inputs */
    input, select, textarea {
      transition: all 0.3s ease;
      outline: none;
    }
    
    /* Premium iOS style focus ring */
    input:focus, select:focus, textarea:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
      background-color: #ffffff !important;
    }
  </style>
</head>
<!-- Beautiful Soft Gradient Background -->
<body class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-indigo-50 via-blue-50 to-purple-50">

  <!-- Premium Card with subtle Glassmorphism & Soft Shadow -->
  <div class="bg-white/80 backdrop-blur-xl p-6 sm:p-8 rounded-[28px] shadow-[0_20px_50px_rgba(8,112,184,0.07)] max-w-md w-full border border-white">
    
    <div class="text-center mb-7">
      <h2 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-gray-900 to-gray-600 tracking-tight">Tracker</h2>
      <p class="text-sm text-gray-500 mt-1">Record your exam conflicts</p>
    </div>
    
    <form id="trackerForm" class="space-y-4">
      
      <div class="space-y-1.5">
        <label class="block text-[13px] font-medium text-gray-600 ml-1">Name</label>
        <input type="text" id="name" required class="w-full rounded-[14px] bg-gray-50/50 border border-gray-200 px-4 py-3 text-gray-900 placeholder-gray-400 text-sm" placeholder="John Doe">
      </div>

      <div class="space-y-1.5">
        <label class="block text-[13px] font-medium text-gray-600 ml-1">Exam Type</label>
        <div class="relative">
          <select id="examType" required class="appearance-none w-full rounded-[14px] bg-gray-50/50 border border-gray-200 px-4 py-3 text-gray-900 pr-8 text-sm">
            <option value="Test 1">Test 1</option>
            <option value="Test 2">Test 2</option>
            <option value="Quiz">Quiz</option>
            <option value="Final">Final</option>
            <option value="Others/Retest....">Others/Retest</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-400">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </div>
        </div>
      </div>

      <div class="space-y-1.5">
        <label class="block text-[13px] font-medium text-gray-600 ml-1">Course Code / Subject</label>
        <!-- Changed placeholder to SKEE123 here -->
        <input type="text" id="courseCode" required class="w-full rounded-[14px] bg-gray-50/50 border border-gray-200 px-4 py-3 text-gray-900 placeholder-gray-400 text-sm" placeholder="e.g. SKEE123">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div class="space-y-1.5">
          <label class="block text-[13px] font-medium text-gray-600 ml-1">Date</label>
          <input type="date" id="examDate" required class="w-full rounded-[14px] bg-gray-50/50 border border-gray-200 px-4 py-3 text-gray-900 text-sm">
        </div>
        <div class="space-y-1.5">
          <label class="block text-[13px] font-medium text-gray-600 ml-1">Time</label>
          <input type="time" id="examTime" required class="w-full rounded-[14px] bg-gray-50/50 border border-gray-200 px-4 py-3 text-gray-900 text-sm">
        </div>
      </div>

      <div class="space-y-1.5">
        <label class="block text-[13px] font-medium text-gray-600 ml-1">Remarks</label>
        <textarea id="remarks" rows="2" class="w-full rounded-[14px] bg-gray-50/50 border border-gray-200 px-4 py-3 text-gray-900 placeholder-gray-400 text-sm" placeholder="Optional notes..."></textarea>
      </div>

      <div class="pt-4">
        <!-- Beautiful Gradient Button with Glow -->
        <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-blue-500 to-indigo-500 text-white font-semibold py-3.5 px-4 rounded-[14px] hover:from-blue-400 hover:to-indigo-400 active:scale-[0.98] transition-all duration-300 shadow-lg shadow-indigo-500/30 text-[15px]">
          Submit
        </button>
      </div>
      
      <p id="statusMsg" class="text-center text-[13px] font-medium mt-4 hidden"></p>
    </form>
  </div>

  <script>
    // ⚠️ DO NOT remove the single quotes! Replace with your actual URL.
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwMpvE9lgcHoOYf06Nt4e4Fs_1lqAyTVWNUGmm0MtqqUZDAz727S25tAh0L01V4o9iCGQ/exec';

    document.getElementById('trackerForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const btn = document.getElementById('submitBtn');
      const statusMsg = document.getElementById('statusMsg');
      
      btn.innerText = 'Submitting...';
      btn.disabled = true;
      btn.classList.add('opacity-70');
      statusMsg.classList.add('hidden');

      const data = {
        name: document.getElementById('name').value,
        examType: document.getElementById('examType').value,
        courseCode: document.getElementById('courseCode').value,
        examDate: document.getElementById('examDate').value,
        examTime: document.getElementById('examTime').value,
        remarks: document.getElementById('remarks').value
      };

      try {
        await fetch(WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(data)
        });

        statusMsg.innerText = 'Success! Your record has been saved.';
        statusMsg.classList.remove('hidden', 'text-red-500');
        statusMsg.classList.add('text-indigo-600');
        document.getElementById('trackerForm').reset();
      } catch (error) {
        statusMsg.innerText = 'Error saving record. Please try again.';
        statusMsg.classList.remove('hidden', 'text-indigo-600');
        statusMsg.classList.add('text-red-500');
      } finally {
        btn.innerText = 'Submit';
        btn.disabled = false;
        btn.classList.remove('opacity-70');
      }
    });
  </script>
</body>
</html>
